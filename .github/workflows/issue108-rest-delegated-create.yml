name: issue108-rest-delegated-create

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/issue108_rest_delegated_create_patch.py'
      - '.github/workflows/issue108-rest-delegated-create.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply REST delegated grant creation projection
        run: python .github/scripts/issue108_rest_delegated_create_patch.py
      - name: Split delegated contract row assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/http_contract_tests.rs')
          text = path.read_text()
          start_marker = '    let row: (String, String, String, String, Option<String>, Option<String>, Option<i64>, i64, String) = conn\n'
          start = text.index(start_marker)
          end = text.index('    let event:', start)
          replacement = '''    let identity_scope: (String, String, String, String) = conn
              .query_row(
                  "SELECT principal_provider, principal_subject, participant_id, capability\n                   FROM delegated_grants WHERE id = ?1",
                  [grant_id],
                  |row| Ok((row.get(0)?, row.get(1)?, row.get(2)?, row.get(3)?)),
              )
              .unwrap();
          assert_eq!(identity_scope.0, "oidc:https://issuer.example");
          assert_eq!(identity_scope.1, "delegated-worker");
          assert_eq!(identity_scope.2, fixture.participant_id);
          assert_eq!(identity_scope.3, "post_message");
          let constraints: (Option<String>, Option<String>, Option<i64>, i64, String) = conn
              .query_row(
                  "SELECT resource, intent_id, expires_at, one_shot, status\n                   FROM delegated_grants WHERE id = ?1",
                  [grant_id],
                  |row| Ok((row.get(0)?, row.get(1)?, row.get(2)?, row.get(3)?, row.get(4)?)),
              )
              .unwrap();
          assert_eq!(constraints.0.as_deref(), Some("control-systems"));
          assert_eq!(constraints.1.as_deref(), Some("intent-rest-delegated-108"));
          assert_eq!(constraints.2, Some(now + 3600));
          assert_eq!(constraints.3, 1);
          assert_eq!(constraints.4, "active");
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Format
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full Rust tests
        run: cargo test --all-targets --all-features
      - name: Commit durable implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/access_api.rs src/authorization_admin.rs src/http_contract_tests.rs
          git commit -m '#108 Expose privileged REST delegated grant creation'
      - name: Remove temporary helpers
        run: |
          git rm .github/scripts/issue108_rest_delegated_create_patch.py
          git rm .github/workflows/issue108-rest-delegated-create.yml
          git commit -m '#108 Remove REST delegated-create migration helpers'
      - name: Push main
        run: git push origin HEAD:main
