name: issue94-mcp-stdio

on:
  push:
    paths:
      - '.github/scripts/issue94_stdio_patch.py'
      - '.github/workflows/issue94-mcp-stdio.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply MCP stdio migration
        run: python .github/scripts/issue94_stdio_patch.py
      - name: Format and verify
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          cargo build --release --locked
      - name: Commit implementation and remove temporary helpers
        run: |
          rm .github/scripts/issue94_stdio_patch.py
          rm .github/workflows/issue94-mcp-stdio.yml
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add -A
          git commit -m '#94 Add first-class MCP stdio server'
          git push origin HEAD:main
