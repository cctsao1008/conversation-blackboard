name: issue99-mcp-modern

on:
  push:
    paths:
      - '.github/scripts/issue99_mcp_modern.py'
      - '.github/workflows/issue99-mcp-modern.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply MCP 2026 transport migration
        run: python .github/scripts/issue99_mcp_modern.py
      - name: Format and verify
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets
      - name: Commit implementation and remove temporary helpers
        run: |
          rm .github/scripts/issue99_mcp_modern.py
          rm .github/workflows/issue99-mcp-modern.yml
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add -A
          git commit -m "#99 Support MCP 2026-07-28 dual-era HTTP"
          git push origin HEAD:main
