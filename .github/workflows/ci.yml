name: core-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --locked --all-targets
      - name: Rust release build
        run: cargo build --release --locked

  windows-service-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Release verification script
        shell: pwsh
        run: .\scripts\verify-release.ps1
      - name: CLI surface
        shell: pwsh
        run: |
          .\target\release\conversation-blackboard.exe --help
          .\target\release\conversation-blackboard.exe db --help
          .\target\release\conversation-blackboard.exe identity --help
          .\target\release\conversation-blackboard.exe participant --help
          .\target\release\conversation-blackboard.exe participant provision --help
          .\target\release\conversation-blackboard.exe participant totp-enroll --help
          .\target\release\conversation-blackboard.exe participant totp-revoke --help
          .\target\release\conversation-blackboard.exe participant generate-signing-key --help
          .\target\release\conversation-blackboard.exe participant set-signing-key --help
          .\target\release\conversation-blackboard.exe participant revoke-signing-key --help
          .\target\release\conversation-blackboard.exe verify --help
          .\target\release\conversation-blackboard.exe client --help
          .\target\release\conversation-blackboard.exe service --help
      - name: Native SCM, operations, and two-identity client smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path ".\target\release\conversation-blackboard.exe").Path
          $runtime = Join-Path $env:RUNNER_TEMP "conversation-blackboard-service-ci"
          $db = Join-Path $runtime "board.db"
          $backup = Join-Path $runtime "board-backup.db"
          $restored = Join-Path $runtime "board-restored.db"
          $port = 18766
          New-Item -ItemType Directory -Force $runtime | Out-Null

          function Provision-Identity([string]$source, [string]$label) {
            $output = (& $exe identity provision --db $db --source $source --label $label) | Out-String
            $lines = $output -split "\r?\n"
            $instanceLine = ($lines | Where-Object { $_ -match '^instance\s*:' } | Select-Object -First 1)
            $tokenLine = ($lines | Where-Object { $_ -match '^token\s*:' } | Select-Object -First 1)
            if (-not $instanceLine -or -not $tokenLine) { throw "identity provisioning output missing instance/token" }
            [pscustomobject]@{
              Instance = ($instanceLine -replace '^instance\s*:\s*', '').Trim()
              Token = ($tokenLine -replace '^token\s*:\s*', '').Trim()
            }
          }

          try {
            & $exe db init --db $db

            $participant = (& $exe participant provision --db $db --participant-id ci-participant-main --source ci-participant --label "CI participant") | Out-String
            if ($participant -notmatch 'participant_id\s*:\s*ci-participant-main') {
              throw "participant provisioning output mismatch"
            }

            $totp = (& $exe participant totp-enroll --db $db --participant-id ci-participant-main) | Out-String
            if ($totp -notmatch 'setup_key\s*:' -or $totp -notmatch 'otpauth_uri\s*:') {
              throw "TOTP enrollment output mismatch"
            }
            & $exe participant totp-revoke --db $db --participant-id ci-participant-main

            $signing = (& $exe participant generate-signing-key) | Out-String
            $publicLine = (($signing -split "\r?\n") | Where-Object { $_ -match '^public_key\s*:' } | Select-Object -First 1)
            $privateLine = (($signing -split "\r?\n") | Where-Object { $_ -match '^private_key\s*:' } | Select-Object -First 1)
            if (-not $publicLine -or -not $privateLine) {
              throw "Ed25519 signing-key generation output mismatch"
            }
            $publicKey = ($publicLine -replace '^public_key\s*:\s*', '').Trim()
            if ($publicKey -notmatch '^ed25519-pk:') {
              throw "Ed25519 public-key prefix mismatch"
            }
            & $exe participant set-signing-key --db $db --participant-id ci-participant-main --public-key $publicKey
            & $exe participant revoke-signing-key --db $db --participant-id ci-participant-main

            $a = Provision-Identity "ci-source-a" "CI identity A"
            $b = Provision-Identity "ci-source-b" "CI identity B"
            if (-not $a.Instance -or -not $a.Token -or -not $b.Instance -or -not $b.Token) {
              throw "identity provisioning returned empty values"
            }

            & $exe service install --db $db --host 127.0.0.1 --port $port
            $svc = Get-Service ConversationBlackboard
            if ($svc.Status -ne "Stopped") { throw "service should be stopped immediately after install" }
            $wmi = Get-CimInstance Win32_Service -Filter "Name='ConversationBlackboard'"
            if ($wmi.StartMode -ne "Auto") { throw "service startup mode is not Automatic" }

            Start-Service ConversationBlackboard
            $deadline = (Get-Date).AddSeconds(20)
            do {
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:$port/api/health" -TimeoutSec 2
                if ($health.status -eq "ok") { break }
              } catch {}
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            if ($health.status -ne "ok") { throw "service health check did not become ready" }

            $env:BLACKBOARD_URL = "http://127.0.0.1:$port"
            $env:BLACKBOARD_TOKEN = $a.Token
            & $exe verify endpoint --expect-source ci-source-a --expect-instance $a.Instance
            $whoA = (& $exe client whoami | Out-String) | ConvertFrom-Json
            if ($whoA.instance -ne $a.Instance) { throw "client A identity mismatch" }
            $messageA = (& $exe client post --channel ci-exchange --body "from A" | Out-String) | ConvertFrom-Json

            $env:BLACKBOARD_TOKEN = $b.Token
            $whoB = (& $exe client whoami | Out-String) | ConvertFrom-Json
            if ($whoB.instance -ne $b.Instance) { throw "client B identity mismatch" }
            $readB = (& $exe client read --after 0 --channel ci-exchange | Out-String) | ConvertFrom-Json
            if ($readB.Count -ne 1 -or $readB[0].instance -ne $a.Instance) { throw "client B did not observe client A message" }
            $messageB = (& $exe client post --channel ci-exchange --body "reply from B" --reply-to $messageA.id | Out-String) | ConvertFrom-Json
            if ($messageB.reply_to -ne $messageA.id -or $messageB.instance -ne $b.Instance) { throw "client B reply provenance mismatch" }

            $env:BLACKBOARD_TOKEN = $a.Token
            $readA = (& $exe client read --after $messageA.id --channel ci-exchange | Out-String) | ConvertFrom-Json
            if ($readA.Count -ne 1 -or $readA[0].instance -ne $b.Instance) { throw "client A did not observe client B reply" }

            & $exe db backup --db $db --out $backup
            & $exe db integrity --db $backup

            Restart-Service ConversationBlackboard
            $deadline = (Get-Date).AddSeconds(20)
            $health = $null
            do {
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:$port/api/health" -TimeoutSec 2
                if ($health.status -eq "ok") { break }
              } catch {}
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            if ($health.status -ne "ok") { throw "service health check did not recover after restart" }
            & $exe verify endpoint --expect-source ci-source-a --expect-instance $a.Instance --channel ci-exchange

            Stop-Service ConversationBlackboard
            (Get-Service ConversationBlackboard).WaitForStatus('Stopped', [TimeSpan]::FromSeconds(20))
            & $exe db integrity --db $db
            & $exe db restore --backup $backup --db $restored
            & $exe db integrity --db $restored

            $rotation = (& $exe identity rotate --db $restored --instance $a.Instance) | Out-String
            if ($rotation -notmatch 'token\s*:') { throw "identity rotation did not issue a token" }
            & $exe identity revoke --db $restored --instance $a.Instance

            $log = Join-Path $runtime "conversation-blackboard.log"
            if (-not (Test-Path $log)) { throw "service lifecycle log was not created" }
            Get-Content $log
            sc.exe qfailure ConversationBlackboard
          }
          finally {
            Remove-Item Env:BLACKBOARD_TOKEN -ErrorAction SilentlyContinue
            Remove-Item Env:BLACKBOARD_URL -ErrorAction SilentlyContinue
            $existing = Get-Service ConversationBlackboard -ErrorAction SilentlyContinue
            if ($existing) {
              if ($existing.Status -ne "Stopped") {
                Stop-Service ConversationBlackboard -Force -ErrorAction SilentlyContinue
              }
              & $exe service uninstall
            }
          }
      - name: Package Windows release artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item .\target\release\conversation-blackboard.exe .\dist\conversation-blackboard.exe
          Copy-Item .\Cargo.lock .\dist\Cargo.lock
          $hash = (Get-FileHash .\dist\conversation-blackboard.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  conversation-blackboard.exe" | Set-Content .\dist\SHA256SUMS.txt -Encoding ascii
          Get-Content .\dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: conversation-blackboard-windows-x64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
