name: core-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Local HTTP E2E smoke
        run: python tools/e2e_smoke.py
      - name: Frozen compatibility scenario on Python
        run: python tools/compat_smoke.py --runtime python

  rust-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        run: cargo test --all-targets
      - name: Rust debug build for compatibility scenario
        run: cargo build
      - name: Frozen compatibility scenario on Rust
        run: python3 tools/compat_smoke.py --runtime rust
      - name: Rust release build
        run: cargo build --release

  windows-service-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests on Windows
        run: cargo test --all-targets
      - name: Windows release build
        run: cargo build --release
      - name: CLI surface
        shell: pwsh
        run: |
          .\target\release\conversation-blackboard.exe --help
          .\target\release\conversation-blackboard.exe db --help
          .\target\release\conversation-blackboard.exe identity --help
          .\target\release\conversation-blackboard.exe verify --help
          .\target\release\conversation-blackboard.exe service --help
      - name: Native SCM and Rust operations smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path ".\target\release\conversation-blackboard.exe").Path
          $runtime = Join-Path $env:RUNNER_TEMP "conversation-blackboard-service-ci"
          $db = Join-Path $runtime "board.db"
          $backup = Join-Path $runtime "board-backup.db"
          $restored = Join-Path $runtime "board-restored.db"
          $port = 18766
          New-Item -ItemType Directory -Force $runtime | Out-Null

          try {
            & $exe db init --db $db

            $provision = (& $exe identity provision --db $db --source ci-source --label "CI identity") | Out-String
            $instanceLine = ($provision -split "`r?`n" | Where-Object { $_ -match '^instance\s*:' } | Select-Object -First 1)
            $tokenLine = ($provision -split "`r?`n" | Where-Object { $_ -match '^token\s*:' } | Select-Object -First 1)
            if (-not $instanceLine -or -not $tokenLine) { throw "identity provisioning output missing instance/token" }
            $instance = ($instanceLine -replace '^instance\s*:\s*', '').Trim()
            $token = ($tokenLine -replace '^token\s*:\s*', '').Trim()
            if (-not $instance -or -not $token) { throw "identity provisioning returned empty instance/token" }

            & $exe service install --db $db --host 127.0.0.1 --port $port

            $svc = Get-Service ConversationBlackboard
            if ($svc.Status -ne "Stopped") { throw "service should be stopped immediately after install" }

            $wmi = Get-CimInstance Win32_Service -Filter "Name='ConversationBlackboard'"
            if ($wmi.StartMode -ne "Auto") { throw "service startup mode is not Automatic" }

            Start-Service ConversationBlackboard
            $deadline = (Get-Date).AddSeconds(20)
            do {
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:$port/api/health" -TimeoutSec 2
                if ($health.status -eq "ok") { break }
              } catch {}
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            if ($health.status -ne "ok") { throw "service health check did not become ready" }

            $env:BLACKBOARD_URL = "http://127.0.0.1:$port"
            $env:BLACKBOARD_TOKEN = $token
            & $exe verify endpoint --expect-source ci-source --expect-instance $instance

            & $exe db backup --db $db --out $backup
            & $exe db integrity --db $backup

            Restart-Service ConversationBlackboard
            $deadline = (Get-Date).AddSeconds(20)
            $health = $null
            do {
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:$port/api/health" -TimeoutSec 2
                if ($health.status -eq "ok") { break }
              } catch {}
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            if ($health.status -ne "ok") { throw "service health check did not recover after restart" }

            & $exe verify endpoint --expect-source ci-source --expect-instance $instance

            Stop-Service ConversationBlackboard
            (Get-Service ConversationBlackboard).WaitForStatus('Stopped', [TimeSpan]::FromSeconds(20))

            & $exe db integrity --db $db
            & $exe db restore --backup $backup --db $restored
            & $exe db integrity --db $restored

            $rotation = (& $exe identity rotate --db $restored --instance $instance) | Out-String
            if ($rotation -notmatch 'token\s*:') { throw "identity rotation did not issue a token" }
            & $exe identity revoke --db $restored --instance $instance

            $log = Join-Path $runtime "conversation-blackboard.log"
            if (-not (Test-Path $log)) { throw "service lifecycle log was not created" }
            Get-Content $log

            sc.exe qfailure ConversationBlackboard
          }
          finally {
            Remove-Item Env:BLACKBOARD_TOKEN -ErrorAction SilentlyContinue
            Remove-Item Env:BLACKBOARD_URL -ErrorAction SilentlyContinue
            $existing = Get-Service ConversationBlackboard -ErrorAction SilentlyContinue
            if ($existing) {
              if ($existing.Status -ne "Stopped") {
                Stop-Service ConversationBlackboard -Force -ErrorAction SilentlyContinue
              }
              & $exe service uninstall
            }
          }
