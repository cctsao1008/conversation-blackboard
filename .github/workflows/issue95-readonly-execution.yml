name: issue95-readonly-execution

on:
  push:
    paths:
      - '.github/scripts/issue95_patch.py'
      - '.github/workflows/issue95-readonly-execution.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply read-only execution schema refactor
        run: python .github/scripts/issue95_patch.py
      - name: Repair current-schema audit fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/execution_integrity_tests.rs')
          s = p.read_text(encoding='utf-8')
          old = '''    conn.execute(\n        "INSERT INTO ingress_provenance\n            (delivery_id, intent_id, transport, external_ref, principal_provider, principal_subject)\n         VALUES ('delivery-85', 'intent-85', 'rest', 'request-85', 'participant-hmac', 'maker-main')",\n        [],\n    )\n    .unwrap();\n'''
          new = '''    conn.execute(\n        "INSERT INTO ingress_provenance\n            (delivery_id, participant_id, intent_id, transport, external_ref,\n             principal_provider, principal_subject)\n         VALUES ('delivery-85', 'maker-main', 'intent-85', 'rest', 'request-85',\n                 'participant-hmac', 'maker-main')",\n        [],\n    )\n    .unwrap();\n'''
          if old not in s:
              raise SystemExit('missing seed_valid ingress fixture marker')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Format and verify
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets
      - name: Commit implementation and remove temporary helpers
        run: |
          rm .github/scripts/issue95_patch.py
          rm .github/workflows/issue95-readonly-execution.yml
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add -A
          git commit -m "#95 Separate execution migration from read-only audit"
          git push origin HEAD:main
