name: refresh-lock

on:
  push:
    branches:
      - auth-ed25519-v2

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build minimal Cargo.lock delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:Cargo.lock > Cargo.lock
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Cargo.lock")
          text = path.read_text()
          marker = ' "reqwest",\n "rusqlite",\n'
          replacement = ' "reqwest",\n "ring",\n "rusqlite",\n'
          if marker not in text:
              raise SystemExit("root dependency marker not found")
          text = text.replace(marker, replacement, 1)
          path.write_text(text)
          PY
      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "auth: keep lockfile delta minimal"
          git push origin HEAD:auth-ed25519-v2
