name: issue98-utcp-schema-fix

on:
  push:
    paths:
      - '.github/scripts/issue98_utcp_schema_fix.py'
      - '.github/workflows/issue98-utcp-schema-fix.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply UTCP schema compatibility repair
        run: python .github/scripts/issue98_utcp_schema_fix.py
      - name: Format and verify
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets
      - name: Commit repair and remove temporary helpers
        run: |
          rm .github/scripts/issue98_utcp_schema_fix.py
          rm .github/workflows/issue98-utcp-schema-fix.yml
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add -A
          git commit -m "#98 Keep UTCP manual schema-valid"
          git push origin HEAD:main
