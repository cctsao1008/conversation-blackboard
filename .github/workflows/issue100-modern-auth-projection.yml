name: issue100-modern-auth-projection

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/issue100_modern_auth_projection.py'
      - '.github/workflows/issue100-modern-auth-projection.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply modern auth projection migration
        run: python .github/scripts/issue100_modern_auth_projection.py
      - name: Format and verify
        run: |
          cargo fmt
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
      - name: Commit modern auth projection
        run: |
          git config user.name "Cheng"
          git config user.email "chiacheng.tsao@gmail.com"
          git add src/mcp.rs src/mcp_contract_tests.rs
          git commit -m "#100 Project Bearer-aware modern MCP tool schemas"
      - name: Remove temporary migration helpers
        run: |
          git rm .github/scripts/issue100_modern_auth_projection.py .github/workflows/issue100-modern-auth-projection.yml
          git commit -m "#100 Remove modern MCP auth projection helpers"
      - name: Push
        run: git push origin HEAD:main
