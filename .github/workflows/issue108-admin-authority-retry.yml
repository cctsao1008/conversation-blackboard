name: issue108-admin-authority-retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue108-admin-authority-retry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply administration authority boundary
        run: python .github/scripts/issue108_admin_authority_patch.py
      - name: Repair Human Web admin fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/authorization_admin.rs')
          text = path.read_text()
          old = '''        .unwrap()
                  .unwrap();
              let admin = Principal {'''
          new = '''        .unwrap()
                  .unwrap();
              identity::set_web_participant_role(&conn, "admin-main", "admin").unwrap();
              let admin = Principal {'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one admin fixture anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full Rust tests
        run: cargo test --all-targets --all-features
      - name: Commit durable implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/authorization.rs src/authorization_admin.rs
          git commit -m '#108 Establish authorization administration authority boundary'
      - name: Remove temporary #108 helpers
        run: |
          git rm -f .github/scripts/issue108_admin_authority_patch.py
          git rm -f .github/scripts/issue108_borrow_fix.py
          git rm -f .github/workflows/issue108-admin-authority.yml
          git rm -f .github/workflows/issue108-admin-authority-retry.yml
          git commit -m '#108 Remove administration authority migration helpers'
      - name: Push main
        run: git push origin HEAD:main
