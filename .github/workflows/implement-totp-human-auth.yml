name: implement-totp-human-auth

on:
  push:
    branches:
      - auth-ed25519-v2
    paths:
      - '.github/scripts/implement_totp_human_auth.py'
      - '.github/workflows/implement-totp-human-auth.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auth-ed25519-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Make helper substitutions literal
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/implement_totp_human_auth.py')
          text = path.read_text(encoding='utf-8')
          needle = 'import re\n'
          shim = '''import re\n\n_original_subn = re.subn\ndef _literal_subn(pattern, repl, string, *args, **kwargs):\n    if isinstance(repl, str):\n        literal = repl\n        repl = lambda _match, literal=literal: literal\n    return _original_subn(pattern, repl, string, *args, **kwargs)\nre.subn = _literal_subn\n'''
          if '_literal_subn' not in text:
              text = text.replace(needle, shim, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Apply TOTP migration
        run: python .github/scripts/implement_totp_human_auth.py
      - name: Remove retired raw participant-key code
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/identity.rs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'use crate::{model::Identity, participant_key, signed_auth, web_auth};',
              'use crate::{model::Identity, signed_auth, web_auth};',
          )
          text = re.sub(
              r'pub fn resolve_web_participant\(.*?\n\}\n\npub fn get_identity',
              'pub fn get_identity',
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r'pub fn validate_private_key\(.*?\n\}\n\npub fn normalize_label',
              'pub fn normalize_label',
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r'pub fn provision_web_participant\(.*?\nfn new_instance_id',
              'fn new_instance_id',
              text,
              count=1,
              flags=re.S,
          )
          tests = r'''#[cfg(test)]
          mod tests {
              use super::*;
              use crate::db;
              use tempfile::tempdir;

              #[test]
              fn sha256_matches_python_contract() {
                  assert_eq!(
                      hash_token("abc"),
                      "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
                  );
              }

              #[test]
              fn source_and_participant_contracts_match_reference() {
                  assert!(validate_source("rotary-inverted-pendulum").is_some());
                  assert!(validate_source(" bad source ").is_none());
                  assert!(validate_participant_id("rotary-main").is_some());
                  assert!(validate_participant_id("rotary/main").is_none());
              }

              #[test]
              fn bearer_rotate_and_revoke_match_reference_semantics() {
                  let dir = tempdir().unwrap();
                  let path = dir.path().join("board.db");
                  db::initialize(&path).unwrap();
                  let conn = db::connect(&path).unwrap();
                  let (identity, original) = register_identity(&conn, "test-source", Some("test")).unwrap();
                  assert!(resolve_identity(&conn, &original).unwrap().is_some());
                  let rotated = rotate_token(&conn, &identity.instance).unwrap().unwrap();
                  assert!(resolve_identity(&conn, &original).unwrap().is_none());
                  assert_eq!(resolve_identity(&conn, &rotated).unwrap().unwrap().instance, identity.instance);
                  assert!(revoke_token(&conn, &identity.instance).unwrap());
                  assert!(resolve_identity(&conn, &rotated).unwrap().is_none());
              }

              #[test]
              fn signing_key_registry_is_rotatable_and_revocable() {
                  let dir = tempdir().unwrap();
                  let path = dir.path().join("board.db");
                  db::initialize(&path).unwrap();
                  let conn = db::connect(&path).unwrap();
                  provision_web_participant_identity(&conn, "claude-main", "claude", Some("Claude"))
                      .unwrap()
                      .unwrap();
                  let (_, public_a) = signed_auth::generate_keypair();
                  let (_, public_b) = signed_auth::generate_keypair();
                  assert!(set_web_participant_signing_key(&conn, "claude-main", &public_a).unwrap());
                  let registered = get_web_participant_verification(&conn, "claude-main").unwrap().unwrap();
                  assert_eq!(registered.identity.instance, "claude-main");
                  assert_eq!(registered.public_key, public_a);
                  assert!(set_web_participant_signing_key(&conn, "claude-main", &public_b).unwrap());
                  assert_eq!(get_web_participant_verification(&conn, "claude-main").unwrap().unwrap().public_key, public_b);
                  assert!(revoke_web_participant_signing_key(&conn, "claude-main").unwrap());
                  assert!(get_web_participant_verification(&conn, "claude-main").unwrap().is_none());
              }
          }
          '''
          text = re.sub(r'#\[cfg\(test\)\]\nmod tests \{.*\Z', tests, text, count=1, flags=re.S)
          path.write_text(text, encoding='utf-8')

          path = Path('src/signed_auth.rs')
          text = path.read_text(encoding='utf-8')
          text = re.sub(
              r'\n#\[cfg\(test\)\]\npub fn sign_message_signature\(.*?\n\}\n',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r'\n    #\[test\]\n    fn generated_pkcs8_shape_matches_browser_normalizer_contract\(\) \{.*?\n    \}\n',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          path.write_text(text, encoding='utf-8')

          path = Path('src/web_auth_contract_tests.rs')
          text = path.read_text(encoding='utf-8').replace(
              'http::{header, HeaderMap, Method, Request, StatusCode},',
              'http::{header, Method, Request, StatusCode},',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Format
        run: cargo fmt --all
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Commit implementation
        run: |
          git config user.name "Cheng"
          git config user.email "chiacheng.tsao@gmail.com"
          git add -A
          git commit -m "auth: replace human browser credentials with TOTP"
          git push origin HEAD:auth-ed25519-v2
