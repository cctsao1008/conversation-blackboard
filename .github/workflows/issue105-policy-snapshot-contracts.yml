name: issue105-policy-snapshot-contracts

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/issue105_policy_snapshot_contracts.py'
      - '.github/workflows/issue105-policy-snapshot-contracts.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply OpenAPI UTCP parity projection
        run: python .github/scripts/issue105_policy_snapshot_contracts.py
      - name: Validate machine-readable contracts
        run: |
          python -m json.tool integrations/utcp.json >/dev/null
          cargo fmt
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
      - name: Commit policy snapshot contract projections
        run: |
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add integrations/openapi.yaml integrations/utcp.json src/contract_parity_tests.rs
          git commit -m "#105 Project authorization policy snapshot contracts"
      - name: Remove temporary migration helpers
        run: |
          git rm .github/scripts/issue105_policy_snapshot_contracts.py
          git rm .github/workflows/issue105-policy-snapshot-contracts.yml
          git commit -m "#105 Remove policy snapshot contract migration helpers"
      - name: Push
        run: git push origin main
