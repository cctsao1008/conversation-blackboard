name: issue75-adapters

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/issue75-adapters.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply #75 adapter capability profiles
        run: python .github/scripts/issue75_patch.py
      - name: Format and validate
        run: |
          cargo fmt --all
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
      - name: Commit implementation and remove temporary helpers
        shell: bash
        run: |
          rm .github/workflows/issue75-adapters.yml .github/scripts/issue75_patch.py
          git config user.name "Cheng"
          git config user.email "chiacheng.tsao@gmail.com"
          git add src/main.rs src/adapter_profile.rs src/participant_auth.rs src/execution.rs src/access_api.rs src/mcp.rs src/mcp_contract_tests.rs docs/adapter-capability-profiles.md .github/workflows/issue75-adapters.yml .github/scripts/issue75_patch.py
          git commit -m "#75 Define adapter capability profiles and MCP read-back"
          git push origin HEAD:main
