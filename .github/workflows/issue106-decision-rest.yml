name: issue106-decision-rest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue106-decision-rest.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply authorization decision REST projection
        run: |
          python .github/scripts/issue106_decision_rest.py
          cargo fmt --all
      - name: Verify REST decision projection
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
      - name: Commit REST decision projection
        run: |
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add src/authorization.rs src/access_api.rs src/http_contract_tests.rs
          git commit -m '#106 Project authorization decisions through REST'
      - name: Remove temporary migration helpers
        run: |
          git rm .github/scripts/issue106_decision_rest.py .github/workflows/issue106-decision-rest.yml
          git commit -m '#106 Remove REST decision migration helpers'
      - name: Push
        run: git push origin HEAD:main
