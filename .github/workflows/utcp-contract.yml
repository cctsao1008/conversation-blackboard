name: utcp-contract

on:
  push:
    paths:
      - "integrations/utcp.json"
      - "src/http.rs"
      - "src/mcp.rs"
      - "src/signed_auth.rs"
      - "src/participant_admin.rs"
      - "tools/utcp_smoke.py"
      - ".github/workflows/utcp-contract.yml"
  pull_request:
    paths:
      - "integrations/utcp.json"
      - "src/http.rs"
      - "src/mcp.rs"
      - "src/signed_auth.rs"
      - "src/participant_admin.rs"
      - "tools/utcp_smoke.py"
      - ".github/workflows/utcp-contract.yml"

permissions:
  contents: read

jobs:
  discovery-and-invocation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned UTCP client and Ed25519 test dependency
        run: python -m pip install "utcp==1.1.4" "utcp-http==1.1.13" "cryptography>=45,<48"
      - name: Build Blackboard
        run: cargo build --release --locked
      - name: Run UTCP discovery/read/write smoke
        run: python tools/utcp_smoke.py --binary target/release/conversation-blackboard
