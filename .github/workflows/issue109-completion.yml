name: issue109-completion

on:
  push:
    paths:
      - ".github/scripts/issue109_completion_patch.py"
      - ".github/workflows/issue109-completion.yml"

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply #109 completion patch
        run: python .github/scripts/issue109_completion_patch.py
      - name: Validate checked-in JSON
        run: python -m json.tool integrations/utcp.json > /dev/null
      - name: Format Rust
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full Rust tests
        run: cargo test --all-targets --all-features
      - name: Commit durable #109 completion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/authorization.rs src/contract_parity_tests.rs integrations/openapi.yaml integrations/utcp.json docs/authorization-policy.md docs/contract-projections.md
          git commit -m '#109 Complete authorization administration history contracts'
      - name: Remove temporary completion helpers
        run: |
          git rm .github/scripts/issue109_completion_patch.py
          git rm .github/workflows/issue109-completion.yml
          git commit -m '#109 Remove completion migration helpers'
      - name: Push main
        run: git push origin HEAD:main
