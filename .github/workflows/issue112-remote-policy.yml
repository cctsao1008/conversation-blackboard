name: issue112-remote-policy

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/issue112_remote_policy_patch.py'
      - '.github/scripts/issue112_remote_policy_tests.py'
      - '.github/scripts/issue112_snapshot_test_only.py'
      - '.github/scripts/issue112_retire_snapshot_contract.py'
      - '.github/workflows/issue112-remote-policy.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply bounded remote policy patch
        run: python .github/scripts/issue112_remote_policy_patch.py
      - name: Retire production full policy snapshot helper
        run: python .github/scripts/issue112_snapshot_test_only.py
      - name: Apply bounded remote policy test migration when present
        run: |
          if [ -f .github/scripts/issue112_remote_policy_tests.py ]; then
            python .github/scripts/issue112_remote_policy_tests.py
          fi
      - name: Retire legacy policy snapshot wire schema
        run: python .github/scripts/issue112_retire_snapshot_contract.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full Rust tests
        run: cargo test --all-targets --all-features
      - name: Validate integration documents
        run: |
          python - <<'PY'
          import json
          json.load(open('integrations/utcp.json'))
          PY
      - name: Commit bounded remote policy projection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/authorization.rs src/access_api.rs src/mcp.rs src/contract_schema.rs src/contract_parity_tests.rs src/http_contract_tests.rs src/mcp_contract_tests.rs integrations/openapi.yaml integrations/utcp.json
          git commit -m '#112 Project bounded authorization policy over REST and MCP'
      - name: Remove temporary helpers
        run: |
          git rm .github/scripts/issue112_remote_policy_patch.py
          git rm .github/scripts/issue112_snapshot_test_only.py
          git rm .github/scripts/issue112_retire_snapshot_contract.py
          if [ -f .github/scripts/issue112_remote_policy_tests.py ]; then
            git rm .github/scripts/issue112_remote_policy_tests.py
          fi
          git rm .github/workflows/issue112-remote-policy.yml
          git commit -m '#112 Remove bounded remote policy migration helpers'
      - name: Push main
        run: git push origin HEAD:main
