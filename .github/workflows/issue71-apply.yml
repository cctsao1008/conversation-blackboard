name: Issue 71 apply webhook integration

on:
  push:
    paths:
      - '.github/workflows/issue71-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply webhook patch
        run: python tools/issue71_patch.py

      - name: Format
        run: cargo fmt

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Commit implementation and remove temporary helpers
        shell: bash
        run: |
          rm tools/issue71_patch.py
          rm .github/workflows/issue71-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "#71 Integrate GitHub ingress with intent-bound execution"
          git push

# retry after wiring AuthorityContext and IntentEnvelope into the GitHub path
