name: Issue 71 intent-authority implementation

on:
  push:
    paths:
      - '.github/workflows/issue71-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply issue 71 phase-1 changes
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          Path('/tmp/issue71_apply.py').write_bytes(base64.b64decode('''          PY
          python /tmp/issue71_apply.py

      - name: Format
        run: cargo fmt

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/issue71-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "#71 Establish intent-bound authority execution model"
          git push
