name: issue106-decision-contracts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue106-decision-contracts.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply authorization decision contract projections
        run: |
          python .github/scripts/issue106_decision_contracts.py
          cargo fmt --all
      - name: Verify decision contract parity
        run: |
          python -m json.tool integrations/utcp.json > /dev/null
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
      - name: Commit decision contract projections
        run: |
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add integrations/openapi.yaml integrations/utcp.json src/contract_parity_tests.rs
          git commit -m '#106 Project authorization decision contracts'
      - name: Remove temporary migration helpers
        run: |
          git rm .github/scripts/issue106_decision_contracts.py .github/workflows/issue106-decision-contracts.yml
          git commit -m '#106 Remove decision contract migration helpers'
      - name: Push
        run: git push origin HEAD:main
