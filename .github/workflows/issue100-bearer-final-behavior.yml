name: issue100-bearer-final-behavior

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/issue100_bearer_final_behavior.py'
      - '.github/workflows/issue100-bearer-final-behavior.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply final bearer behavior migration
        run: python .github/scripts/issue100_bearer_final_behavior.py
      - name: Format and verify
        run: |
          cargo fmt
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
      - name: Commit final bearer behavior regressions
        run: |
          git config user.name "Cheng"
          git config user.email "chiacheng.tsao@gmail.com"
          git add src/mcp_contract_tests.rs
          git commit -m "#100 Lock bearer credential and audit-sweep boundaries"
      - name: Remove temporary migration helpers
        run: |
          git rm .github/scripts/issue100_bearer_final_behavior.py .github/workflows/issue100-bearer-final-behavior.yml
          git commit -m "#100 Remove final bearer behavior helpers"
      - name: Push
        run: git push origin HEAD:main
