name: issue74-enforce

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/issue74-enforce.yml

permissions:
  contents: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply #74 execution enforcement
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Central execution boundary: every semantic message execution is policy-authorized.
          replace_once(
              "src/execution.rs",
              "use crate::{\n    identity,\n    model::{Identity, Message},\n};",
              "use crate::{\n    authorization, identity,\n    model::{Identity, Message},\n};",
          )
          replace_once(
              "src/execution.rs",
              "    ChannelArchived,\n}",
              "    ChannelArchived,\n    AuthorizationDenied,\n}",
          )
          replace_once(
              "src/execution.rs",
              "    {\n        return Err(rusqlite::Error::InvalidQuery);\n    }\n\n    let tx = conn.unchecked_transaction()?;",
              "    {\n        return Err(rusqlite::Error::InvalidQuery);\n    }\n\n    if !authorization::authorize(\n        conn,\n        &request.authority.principal,\n        &request.intent.participant_id,\n        &request.intent.capability,\n        Some(&request.intent.resource),\n    )? {\n        return Ok(MessageExecutionResult::AuthorizationDenied);\n    }\n\n    let tx = conn.unchecked_transaction()?;",
          )
          replace_once(
              "src/execution.rs",
              '            provider: "hmac".into(),',
              '            provider: "participant-hmac".into(),',
          )
          replace_once(
              "src/execution.rs",
              "    fn test_identity() -> Identity {\n        Identity {\n            source: \"maker\".into(),\n            instance: \"maker-main\".into(),\n            label: None,\n        }\n    }\n",
              "    fn test_identity() -> Identity {\n        Identity {\n            source: \"maker\".into(),\n            instance: \"maker-main\".into(),\n            label: None,\n        }\n    }\n\n    fn provision_test_participant(conn: &Connection) {\n        identity::provision_web_participant_identity(\n            conn,\n            \"maker-main\",\n            \"maker\",\n            Some(\"Maker\"),\n        )\n        .unwrap()\n        .unwrap();\n    }\n",
          )
          replace_once(
              "src/execution.rs",
              "        let conn = db::connect(&path).unwrap();\n        let identity = test_identity();\n        let (authority, intent, rest_ingress) = test_request_parts(\"semantic-intent-1\");",
              "        let conn = db::connect(&path).unwrap();\n        provision_test_participant(&conn);\n        let identity = test_identity();\n        let (authority, intent, rest_ingress) = test_request_parts(\"semantic-intent-1\");",
          )
          replace_once(
              "src/execution.rs",
              "        let conn = db::connect(&path).unwrap();\n        ensure_execution_tables(&conn).unwrap();\n\n        conn.execute(\n            \"INSERT INTO ingress_provenance",
              "        let conn = db::connect(&path).unwrap();\n        provision_test_participant(&conn);\n        ensure_execution_tables(&conn).unwrap();\n\n        conn.execute(\n            \"INSERT INTO ingress_provenance",
          )

          # REST and MCP surface an authorization denial as a policy error, not a DB failure.
          replace_once(
              "src/http.rs",
              "        execution::MessageExecutionResult::ChannelArchived => {\n            return Err(ApiError::new(StatusCode::CONFLICT, \"channel_archived\"));\n        }\n    };",
              "        execution::MessageExecutionResult::ChannelArchived => {\n            return Err(ApiError::new(StatusCode::CONFLICT, \"channel_archived\"));\n        }\n        execution::MessageExecutionResult::AuthorizationDenied => {\n            return Err(ApiError::forbidden());\n        }\n    };",
          )
          replace_once(
              "src/mcp.rs",
              "        execution::MessageExecutionResult::ChannelArchived => {\n            return tool_error(\"channel_archived\")\n        }\n    };",
              "        execution::MessageExecutionResult::ChannelArchived => {\n            return tool_error(\"channel_archived\")\n        }\n        execution::MessageExecutionResult::AuthorizationDenied => return tool_error(\"forbidden\"),\n    };",
          )

          # GitHub transport now authenticates the principal, then delegates authorization to the common policy kernel.
          replace_once(
              "src/github_webhook.rs",
              "use rusqlite::{params, Connection, OptionalExtension};",
              "use rusqlite::{params, Connection};",
          )
          replace_once(
              "src/github_webhook.rs",
              "use crate::{db, execution, identity, model::Identity};",
              "use crate::{db, execution, identity};",
          )
          replace_once(
              "src/github_webhook.rs",
              "            let identity = get_owned_active_participant(&conn, &participant_id, &owner_subject)?\n                .ok_or(rusqlite::Error::QueryReturnedNoRows)?;",
              "            let identity = identity::get_web_participant(&conn, &participant_id)?\n                .ok_or(rusqlite::Error::QueryReturnedNoRows)?;",
          )
          replace_once(
              "src/github_webhook.rs",
              "                    execution::MessageExecutionResult::ChannelArchived => {\n                        WebhookWriteResult::ChannelArchived\n                    }\n                },",
              "                    execution::MessageExecutionResult::ChannelArchived => {\n                        WebhookWriteResult::ChannelArchived\n                    }\n                    execution::MessageExecutionResult::AuthorizationDenied => {\n                        WebhookWriteResult::AuthorizationDenied\n                    }\n                },",
          )
          old_helper = '''fn get_owned_active_participant(
              conn: &Connection,
              participant_id: &str,
              owner_subject: &str,
          ) -> rusqlite::Result<Option<Identity>> {
              conn.query_row(
                  "SELECT source, participant_id, label\\n         FROM web_participants\\n         WHERE participant_id = ?1\\n           AND status = 'active'\\n           AND owner_provider = 'github'\\n           AND owner_subject = ?2\\n         LIMIT 1",
                  params![participant_id, owner_subject],
                  |row| {
                      Ok(Identity {
                          source: row.get(0)?,
                          instance: row.get(1)?,
                          label: row.get(2)?,
                      })
                  },
              )
              .optional()
          }

          '''
          replace_once("src/github_webhook.rs", old_helper, "")
          replace_once(
              "src/github_webhook.rs",
              "        WebhookWriteResult::ChannelArchived => {\n            error_response(StatusCode::CONFLICT, \"channel_archived\")\n        }\n    }",
              "        WebhookWriteResult::ChannelArchived => {\n            error_response(StatusCode::CONFLICT, \"channel_archived\")\n        }\n        WebhookWriteResult::AuthorizationDenied => {\n            error_response(StatusCode::FORBIDDEN, \"github_participant_not_owned\")\n        }\n    }",
          )
          replace_once(
              "src/github_webhook.rs",
              "    ChannelArchived,\n}",
              "    ChannelArchived,\n    AuthorizationDenied,\n}",
          )
          replace_once(
              "src/github_webhook.rs",
              "    #[tokio::test]\n    async fn invalid_signature_is_rejected_before_payload_authorization() {",
              '''    #[tokio::test]
              async fn scoped_grant_restricts_github_write_resource() {
                  let (_dir, path, router) = fixture();
                  let conn = db::connect(&path).unwrap();
                  conn.execute(
                      "INSERT INTO principal_grants
                          (principal_provider, principal_subject, participant_id, capability, resource)
                       VALUES ('github', '123456', 'alice-main', 'post_message', 'control-systems')",
                      [],
                  )
                  .unwrap();

                  let body = payload(123456, "COLLABORATOR", "alice-main");
                  let (status, response) = send(router, body.clone(), sign(&body)).await;
                  assert_eq!(status, StatusCode::FORBIDDEN);
                  assert_eq!(response["error"], "github_participant_not_owned");
              }

              #[tokio::test]
              async fn invalid_signature_is_rejected_before_payload_authorization() {''',
          )

      - name: Format and validate
        run: |
          cargo fmt --all
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
      - name: Commit enforcement and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/issue74-enforce.yml
          git config user.name "Cheng"
          git config user.email "chiacheng.tsao@gmail.com"
          git add src/execution.rs src/http.rs src/mcp.rs src/github_webhook.rs .github/workflows/issue74-enforce.yml
          git commit -m "#74 Enforce scoped grants across execution ingress"
          git push origin HEAD:main
