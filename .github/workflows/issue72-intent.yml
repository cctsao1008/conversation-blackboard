name: Issue 72 semantic intent convergence

# Retry after GitHub reported a startup_failure before any job was created.
on:
  push:
    paths:
      - '.github/workflows/issue72-intent.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply semantic intent patch
        run: python tools/issue72_intent_patch.py

      - name: Format
        run: cargo fmt

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Commit implementation and remove temporary helpers
        shell: bash
        run: |
          rm tools/issue72_intent_patch.py
          rm .github/workflows/issue72-intent.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "#72 Separate semantic intent from REST and MCP delivery"
          git push
