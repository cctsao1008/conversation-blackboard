name: cargo-lock-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cargo-lock:
    if: contains(github.event.head_commit.message, '[cargo-lock-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      - name: Commit Cargo.lock
        run: |
          if git diff --quiet -- Cargo.lock && git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            echo "Cargo.lock already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Pin Rust dependency graph"
          git push
