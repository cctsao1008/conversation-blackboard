name: one-shot-conversation-ref-rename

on:
  push:
    paths:
      - .github/workflows/rename-conversation-ref.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rename conversation provenance field
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path('.')
          workflow = Path('.github/workflows/rename-conversation-ref.yml')

          files = subprocess.check_output(
              ['git', 'grep', '-Il', 'conversation_uuid', '--', '.'],
              text=True,
          ).splitlines()

          for name in files:
              path = Path(name)
              if path == workflow:
                  continue
              text = path.read_text(encoding='utf-8')
              path.write_text(text.replace('conversation_uuid', 'conversation_ref'), encoding='utf-8')

          db = Path('src/db.rs')
          text = db.read_text(encoding='utf-8')
          simple = '''fn migrate_message_conversation_ref(conn: &Connection) -> Result<()> {
              if !table_has_column(conn, "messages", "conversation_ref")? {
                  conn.execute("ALTER TABLE messages ADD COLUMN conversation_ref TEXT", [])?;
              }
              Ok(())
          }
          '''
          robust = '''fn migrate_message_conversation_ref(conn: &Connection) -> Result<()> {
              if table_has_column(conn, "messages", "conversation_ref")? {
                  return Ok(());
              }
              if table_has_column(conn, "messages", "conversation_uuid")? {
                  conn.execute(
                      "ALTER TABLE messages RENAME COLUMN conversation_uuid TO conversation_ref",
                      [],
                  )?;
              } else {
                  conn.execute("ALTER TABLE messages ADD COLUMN conversation_ref TEXT", [])?;
              }
              Ok(())
          }
          '''
          if simple not in text:
              raise SystemExit('expected migration function not found after rename')
          text = text.replace(simple, robust, 1)

          marker = '\n}\n'
          insert_at = text.rfind(marker)
          if insert_at < 0:
              raise SystemExit('db.rs final module terminator not found')
          migration_test = r'''

              #[test]
              fn migration_renames_legacy_conversation_uuid_column_and_preserves_value() {
                  let dir = tempdir().unwrap();
                  let path = dir.path().join("board.db");
                  {
                      let conn = Connection::open(&path).unwrap();
                      conn.execute_batch(
                          "CREATE TABLE messages (\n\
                              id INTEGER PRIMARY KEY,\n\
                              created_at INTEGER NOT NULL DEFAULT (unixepoch()),\n\
                              channel TEXT NOT NULL,\n\
                              source TEXT NOT NULL,\n\
                              instance TEXT NOT NULL,\n\
                              conversation_uuid TEXT,\n\
                              kind TEXT NOT NULL DEFAULT 'message',\n\
                              body TEXT NOT NULL,\n\
                              reply_to INTEGER\n\
                          );\n\
                          INSERT INTO messages\n\
                              (channel, source, instance, conversation_uuid, kind, body)\n\
                          VALUES\n\
                              ('blackboard-lounge', 'legacy', 'legacy-main', 'legacy-chat-42', 'message', 'before rename');",
                      )
                      .unwrap();
                  }

                  initialize(&path).unwrap();
                  let conn = connect(&path).unwrap();
                  assert!(table_has_column(&conn, "messages", "conversation_ref").unwrap());
                  assert!(!table_has_column(&conn, "messages", "conversation_uuid").unwrap());
                  let messages = list_messages_after(&conn, 0, Some("blackboard-lounge"), 10).unwrap();
                  assert_eq!(messages.len(), 1);
                  assert_eq!(messages[0].conversation_ref.as_deref(), Some("legacy-chat-42"));
              }
          '''
          text = text[:insert_at] + migration_test + text[insert_at:]
          db.write_text(text, encoding='utf-8')
          PY

          cargo fmt --all
          cargo test --locked --all-targets

          if git grep -n 'conversation_uuid' -- ':!.github/workflows/rename-conversation-ref.yml'; then
            echo 'Remaining conversation_uuid references are expected only in DB migration compatibility code/tests above.'
          fi

          git rm .github/workflows/rename-conversation-ref.yml
          git config user.name "Cheng"
          git config user.email "chiacheng.tsao@gmail.com"
          git add -A
          git commit -m "#67 Rename conversation_uuid to conversation_ref"
          git push origin HEAD:main
