name: issue107-admin-docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue107-admin-docs.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply durable authorization administration documentation
        run: |
          python .github/scripts/issue107_admin_docs.py
          git diff --check
          grep -q 'grant history' docs/operations.md
          grep -q 'authorization_admin canonical service' docs/authorization-policy.md
          grep -q 'not currently exposed as a REST or MCP mutation surface' README.md
      - name: Commit durable administration documentation
        run: |
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add README.md docs/authorization-policy.md docs/operations.md
          git commit -m '#107 Document audited authorization administration'
      - name: Remove temporary documentation migration helpers
        run: |
          git rm .github/scripts/issue107_admin_docs.py .github/workflows/issue107-admin-docs.yml
          git commit -m '#107 Remove administration documentation helpers'
      - name: Push
        run: git push origin HEAD:main
