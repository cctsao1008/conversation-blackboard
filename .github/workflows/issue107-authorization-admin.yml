name: issue107-authorization-admin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue107-authorization-admin.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply canonical authorization administration service
        run: |
          python .github/scripts/issue107_authorization_admin.py
          python .github/scripts/issue107_authorization_admin_postpatch.py
          cargo fmt --all
      - name: Verify authorization administration migration
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
      - name: Commit canonical authorization administration service
        run: |
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add schema.sql src/main.rs src/db.rs src/authorization_admin.rs src/grant_admin.rs
          git commit -m '#107 Canonicalize authorization administration mutations'
      - name: Remove temporary migration helpers
        run: |
          git rm .github/scripts/issue107_authorization_admin.py .github/scripts/issue107_authorization_admin_postpatch.py .github/workflows/issue107-authorization-admin.yml
          git commit -m '#107 Remove authorization administration migration helpers'
      - name: Push
        run: git push origin HEAD:main
