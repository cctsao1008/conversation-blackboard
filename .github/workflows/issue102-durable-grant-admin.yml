name: issue102-durable-grant-admin

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/issue102_durable_grant_admin.py'
      - '.github/workflows/issue102-durable-grant-admin.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply durable grant admin migration
        run: python .github/scripts/issue102_durable_grant_admin.py
      - name: Format and verify
        run: |
          cargo fmt
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
      - name: Commit durable grant admin surface
        run: |
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add src/authorization.rs src/grant_admin.rs src/main.rs docs/operations.md
          git diff --cached --quiet && { echo 'migration produced no durable changes'; exit 1; }
          git commit -m '#102 Add durable principal grant operator surface'
      - name: Remove temporary migration helpers
        run: |
          git rm .github/scripts/issue102_durable_grant_admin.py .github/workflows/issue102-durable-grant-admin.yml
          git commit -m '#102 Remove durable grant admin migration helpers'
      - name: Push
        run: git push origin main
