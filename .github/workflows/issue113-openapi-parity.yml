name: issue113-openapi-parity

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/issue113_openapi_parity_patch.py'
      - '.github/workflows/issue113-openapi-parity.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply channel directory OpenAPI parity patch
        run: python .github/scripts/issue113_openapi_parity_patch.py
      - name: Validate OpenAPI YAML
        run: python -c "import yaml; yaml.safe_load(open('integrations/openapi.yaml'))"
      - name: Format Rust
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full Rust tests
        run: cargo test --all-targets --all-features
      - name: Commit channel directory OpenAPI parity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrations/openapi.yaml src/contract_parity_tests.rs
          git commit -m '#113 Align channel directory OpenAPI with bounded runtime'
      - name: Remove temporary helpers
        run: |
          git rm .github/scripts/issue113_openapi_parity_patch.py
          git rm .github/workflows/issue113-openapi-parity.yml
          git commit -m '#113 Remove channel OpenAPI migration helpers'
      - name: Push main
        run: git push origin HEAD:main
