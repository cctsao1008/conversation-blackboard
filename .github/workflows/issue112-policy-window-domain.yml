name: issue112-policy-window-domain

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/issue112_policy_window_domain.py'
      - '.github/scripts/issue112_policy_window_usage_fix.py'
      - '.github/workflows/issue112-policy-window-domain.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply canonical policy window patch
        run: python .github/scripts/issue112_policy_window_domain.py
      - name: Reuse bounded kernel from legacy full snapshot
        run: python .github/scripts/issue112_policy_window_usage_fix.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full Rust tests
        run: cargo test --all-targets --all-features
      - name: Commit canonical policy window domain
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/authorization.rs
          git commit -m '#112 Add canonical bounded authorization policy window'
      - name: Remove temporary helpers
        run: |
          git rm .github/scripts/issue112_policy_window_domain.py
          git rm .github/scripts/issue112_policy_window_usage_fix.py
          git rm .github/workflows/issue112-policy-window-domain.yml
          git commit -m '#112 Remove policy window domain migration helpers'
      - name: Push main
        run: git push origin HEAD:main
