name: issue111-remote-window

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/issue111_remote_window_patch.py'
      - '.github/scripts/issue111_retire_full_reader.py'
      - '.github/workflows/issue111-remote-window.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply bounded remote history patch
        run: python .github/scripts/issue111_remote_window_patch.py
      - name: Retire unbounded history reader
        run: python .github/scripts/issue111_retire_full_reader.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full Rust tests
        run: cargo test --all-targets --all-features
      - name: Validate integration documents
        run: |
          python - <<'PY'
          import json
          json.load(open('integrations/utcp.json'))
          PY
      - name: Commit bounded remote history projection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/authorization_admin.rs src/access_api.rs src/mcp.rs src/contract_schema.rs integrations/openapi.yaml integrations/utcp.json
          git commit -m '#111 Project bounded administration history over REST and MCP'
      - name: Remove temporary helpers
        run: |
          git rm .github/scripts/issue111_remote_window_patch.py
          git rm .github/scripts/issue111_retire_full_reader.py
          git rm .github/workflows/issue111-remote-window.yml
          git commit -m '#111 Remove bounded remote history migration helpers'
      - name: Push main
        run: git push origin HEAD:main
