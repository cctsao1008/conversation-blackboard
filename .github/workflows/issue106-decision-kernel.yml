name: issue106-decision-kernel

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/issue106_decision_kernel.py'
      - '.github/workflows/issue106-decision-kernel.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply decision-kernel migration
        run: python .github/scripts/issue106_decision_kernel.py
      - name: Verify read-only decision boundary
        run: |
          cargo fmt
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
      - name: Commit decision-kernel boundary
        run: |
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add src/authorization.rs src/grant_admin.rs
          git commit -m "#106 Make authorization explanation observationally read-only"
      - name: Remove temporary migration helpers
        run: |
          git rm .github/scripts/issue106_decision_kernel.py
          git rm .github/workflows/issue106-decision-kernel.yml
          git commit -m "#106 Remove decision-kernel migration helpers"
      - name: Push
        run: git push origin main
