name: issue100-mcp-bearer-tests

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/issue100_mcp_bearer_tests.py'
      - '.github/workflows/issue100-mcp-bearer-tests.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Add bearer authority regression tests
        run: python .github/scripts/issue100_mcp_bearer_tests.py
      - name: Format and verify
        run: |
          cargo fmt
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
      - name: Commit bearer authority regressions
        run: |
          git config user.name "Cheng"
          git config user.email "chiacheng.tsao@gmail.com"
          git add src/oidc.rs src/mcp_contract_tests.rs
          git commit -m "#100 Lock MCP bearer authority regressions"
      - name: Remove temporary migration helpers
        run: |
          git rm .github/scripts/issue100_mcp_bearer_tests.py .github/workflows/issue100-mcp-bearer-tests.yml
          git commit -m "#100 Remove MCP bearer test migration helpers"
      - name: Push
        run: git push origin HEAD:main
