name: fix-auth-clippy

on:
  push:
    branches:
      - auth-ed25519-v2

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply focused clippy annotation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/mcp.rs')
          text = path.read_text()
          old = '\nasync fn resolve_write_identity(\n'
          new = '\n#[allow(clippy::too_many_arguments)]\nasync fn resolve_write_identity(\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('resolve_write_identity marker not found')
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          cargo fmt --all
      - name: Commit fix if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mcp.rs src/signed_auth.rs
          git commit -m "auth: satisfy strict clippy for signed write helpers"
          git push origin HEAD:auth-ed25519-v2
