name: issue70-contract-cleanup

on:
  push:
    paths:
      - '.github/workflows/issue70-contract-cleanup.yml'

permissions:
  contents: write

jobs:
  patch-current-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align MCP and machine-readable message schemas
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/mcp.rs',
              '            "instance": {"type": "string"},\n            "kind": {"type": "string"},',
              '            "instance": {"type": "string"},\n            "conversation_ref": {"anyOf": [{"type": "string"}, {"type": "null"}]},\n            "kind": {"type": "string"},'
          )
          replace_once(
              'src/mcp.rs',
              '        "required": ["id", "created_at", "channel", "source", "instance", "kind", "body", "reply_to"],',
              '        "required": ["id", "created_at", "channel", "source", "instance", "conversation_ref", "kind", "body", "reply_to"],'
          )

          test_path = Path('src/mcp_contract_tests.rs')
          tests = test_path.read_text(encoding='utf-8')
          marker = '#[tokio::test]\nasync fn public_read_is_unsigned_private_read_requires_valid_hmac() {'
          if tests.count(marker) != 1:
              raise SystemExit('mcp_contract_tests.rs: insertion marker mismatch')
          new_test = '''#[tokio::test]\nasync fn mcp_read_schema_includes_conversation_ref_provenance() {\n    let fixture = fixture();\n    let response = request(\n        &fixture.router,\n        Method::POST,\n        Some(json!({\n            "jsonrpc": "2.0",\n            "id": 1,\n            "method": "tools/list",\n            "params": {}\n        })),\n    )\n    .await;\n    let (_, value) = response_json(response).await;\n    let read_tool = &value["result"]["tools"][0];\n    let message = &read_tool["outputSchema"]["properties"]["messages"]["items"];\n    assert!(message["properties"]["conversation_ref"].is_object());\n    let required = message["required"].as_array().unwrap();\n    assert!(required.iter().any(|field| field == "conversation_ref"));\n}\n\n'''
          tests = tests.replace(marker, new_test + marker, 1)
          test_path.write_text(tests, encoding='utf-8')

          for path in ('integrations/openapi.yaml', 'integrations/utcp.json'):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if path.endswith('.yaml'):
                  old = 'required: [id, created_at, channel, source, instance, kind, body, reply_to]'
                  new = 'required: [id, created_at, channel, source, instance, conversation_ref, kind, body, reply_to]'
              else:
                  old = '"required": ["id", "created_at", "channel", "source", "instance", "kind", "body"]'
                  new = '"required": ["id", "created_at", "channel", "source", "instance", "conversation_ref", "kind", "body"]'
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'{path}: required-list pattern not found')
              p.write_text(text.replace(old, new), encoding='utf-8')
      - name: Verify Rust formatting and tests
        run: |
          cargo fmt --all -- --check
          cargo test --locked --all-targets
      - name: Commit cleanup and remove temporary workflow
        run: |
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git rm .github/workflows/issue70-contract-cleanup.yml
          git add src/mcp.rs src/mcp_contract_tests.rs integrations/openapi.yaml integrations/utcp.json
          git commit -m '#70 Align MCP and integration provenance schemas'
          git push origin HEAD:main
