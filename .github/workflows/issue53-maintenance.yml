name: issue53-maintenance

on:
  push:
    branches:
      - issue-53-access-control

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-53-access-control
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Migrate UTCP smoke to signed private-channel reads
        shell: python
        run: |
          from pathlib import Path

          path = Path("tools/utcp_smoke.py")
          text = path.read_text(encoding="utf-8")

          if "def sign_read(" not in text:
              marker = "\n\nasync def exercise_interfaces("
              function = '''\n\ndef sign_read(\n    private_key: str,\n    participant_id: str,\n    channel: str,\n    after: int,\n    limit: int,\n) -> str:\n    key = Ed25519PrivateKey.from_private_bytes(ring_private_seed(private_key))\n    payload = {\n        "after": after,\n        "channel": channel,\n        "limit": limit,\n        "participant_id": participant_id,\n        "purpose": "blackboard-read-v1",\n        "signature_version": SIGNATURE_SCHEME,\n    }\n    canonical = json.dumps(\n        payload,\n        ensure_ascii=False,\n        sort_keys=True,\n        separators=(",", ":"),\n    ).encode("utf-8")\n    signature = key.sign(canonical)\n    if len(signature) != 64:\n        raise RuntimeError("unexpected Ed25519 signature length")\n    return base64url_encode_unpadded(signature)\n'''
              if marker not in text:
                  raise SystemExit("could not find exercise_interfaces marker")
              text = text.replace(marker, function + marker, 1)

          old = '''    mcp_observed = mcp_call(\n        base_url,\n        1,\n        "blackboard_read",\n        {"channel": "utcp-ci", "after": 0, "limit": 20},\n    )\n'''
          new = '''    read_signature = sign_read(\n        private_key, participant_id, "utcp-ci", 0, 20\n    )\n    mcp_observed = mcp_call(\n        base_url,\n        1,\n        "blackboard_read",\n        {\n            "participant_id": participant_id,\n            "auth": {"scheme": SIGNATURE_SCHEME, "signature": read_signature},\n            "channel": "utcp-ci",\n            "after": 0,\n            "limit": 20,\n        },\n    )\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif "read_signature = sign_read(" not in text:
              raise SystemExit("could not find MCP read smoke block")

          path.write_text(text, encoding="utf-8")
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit maintenance fixes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo "No maintenance changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/utcp_smoke.py src
          git commit -m "chore: converge issue 53 validation"
          git push origin HEAD:issue-53-access-control
