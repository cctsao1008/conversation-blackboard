name: issue77-oidc

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/issue77-oidc.yml
      - .github/scripts/issue77_oidc.py

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply #77 external OIDC resource-server patch
        run: python .github/scripts/issue77_oidc.py
      - name: Remove stale generated import
        run: sed -i 's/use crate::{db, execution, identity, model::Identity};/use crate::{db, execution, identity};/' src/oidc.rs
      - name: Update dependency lock
        run: cargo test --all-features --no-run
      - name: Format and validate
        run: |
          cargo fmt --all
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
      - name: Commit implementation and remove temporary helpers
        run: |
          rm -f .github/workflows/issue77-oidc.yml .github/scripts/issue77_oidc.py
          git config user.name "Cheng"
          git config user.email "chiacheng.tsao@gmail.com"
          git add -A
          git commit -m "#77 Add external OIDC resource-server validation"
          git push origin main
