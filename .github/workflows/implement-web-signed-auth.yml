              '''pub const PARTICIPANT_ID_HEADER: &str = "x-blackboard-participant-id";\npub const PRIVATE_KEY_HEADER: &str = "x-blackboard-private-key";\n\n''',
              '''pub const PARTICIPANT_ID_HEADER: &str = "x-blackboard-participant-id";\npub const PRIVATE_KEY_HEADER: &str = "x-blackboard-private-key";\npub const SIGNATURE_SCHEME_HEADER: &str = "x-blackboard-signature-scheme";\npub const SIGNATURE_HEADER: &str = "x-blackboard-signature";\n\npub fn resolve_request_identity_for_target(\n    conn: &Connection,\n    headers: &HeaderMap,\n    method: &str,\n    request_target: &str,\n) -> Result<Option<Identity>> {\n    let signed_attempt = headers.contains_key(SIGNATURE_HEADER)\n        || headers.contains_key(SIGNATURE_SCHEME_HEADER);\n    if !signed_attempt {\n        return resolve_request_identity(conn, headers);\n    }\n    if headers.contains_key(PRIVATE_KEY_HEADER) {\n        return Ok(None);\n    }\n\n    let Some(participant_id) = header_text(headers, PARTICIPANT_ID_HEADER) else {\n        return Ok(None);\n    };\n    let Some(scheme) = header_text(headers, SIGNATURE_SCHEME_HEADER) else {\n        return Ok(None);\n    };\n    let Some(signature) = header_text(headers, SIGNATURE_HEADER) else {\n        return Ok(None);\n    };\n    if scheme != signed_auth::SIGNATURE_SCHEME {\n        return Ok(None);\n    }\n    let Some(verification) = identity::get_web_participant_verification(conn, participant_id)? else {\n        return Ok(None);\n    };\n    if verification.signature_scheme != scheme\n        || !web_auth::verify_http_request_signature(\n            &verification.public_key,\n            signature,\n            participant_id,\n            method,\n            request_target,\n        )\n    {\n        return Ok(None);\n    }\n    Ok(Some(verification.identity))\n}\n\n''',
          )

          replace_once(
              'src/http.rs',
              'use crate::{db, identity, model::Identity, request_auth};\n',
              'use crate::{db, identity, model::Identity, request_auth, signed_auth, web_auth};\n',
          )
          replace_once(
              'src/http.rs',
              '''        .route("/api/health", get(health))\n        .route("/api/whoami", get(whoami))\n''',
              '''        .route("/api/health", get(health))\n        .route("/api/auth/challenge", post(auth_challenge))\n        .route("/api/auth/verify", post(auth_verify))\n        .route("/api/whoami", get(whoami))\n''',
          )

          replace_once(
              'src/http.rs',
              '''async fn whoami(State(state): State<AppState>, headers: HeaderMap) -> Result<Response, ApiError> {\n''',
              r'''async fn auth_challenge(
    State(state): State<AppState>,
    request: Request<Body>,
) -> Result<Response, ApiError> {
    let body = read_json_object(request).await?;
    if !only_keys(&body, &["participant_id"]) {
        return Err(ApiError::new(StatusCode::BAD_REQUEST, "invalid_auth"));
    }
    let participant_id = body
        .get("participant_id")
        .and_then(Value::as_str)
        .and_then(identity::validate_participant_id)
        .ok_or_else(|| ApiError::new(StatusCode::BAD_REQUEST, "invalid_participant_id"))?;

    let lookup = participant_id.clone();
    let registered = with_db(&state, move |conn| {
        identity::get_web_participant_verification(conn, &lookup)
    })
    .await?;
    if registered.is_none() {
        return Err(ApiError::unauthorized());
    }

    let challenge = web_auth::issue_browser_challenge(&participant_id);
    Ok(json_response(
        StatusCode::OK,
        json!({
            "signature_version": signed_auth::SIGNATURE_SCHEME,
            "purpose": web_auth::BROWSER_CHALLENGE_PURPOSE,
            "challenge": challenge.challenge,
            "expires_at": challenge.expires_at,
            "challenge_token": challenge.challenge_token,
        }),
    ))
}

async fn auth_verify(
    State(state): State<AppState>,
    request: Request<Body>,
) -> Result<Response, ApiError> {
    let body = read_json_object(request).await?;
    if !only_keys(
        &body,
        &[
            "participant_id",
            "challenge",
            "expires_at",
            "challenge_token",
            "auth",
        ],
    ) {
        return Err(ApiError::new(StatusCode::BAD_REQUEST, "invalid_auth"));
    }

    let participant_id = body
        .get("participant_id")
        .and_then(Value::as_str)
        .and_then(identity::validate_participant_id)
        .ok_or_else(|| ApiError::new(StatusCode::BAD_REQUEST, "invalid_participant_id"))?;
    let challenge = body
        .get("challenge")
        .and_then(Value::as_str)
        .filter(|value| !value.is_empty() && value.len() <= 256)
        .ok_or_else(|| ApiError::new(StatusCode::BAD_REQUEST, "invalid_auth"))?
        .to_owned();
    let expires_at = body
        .get("expires_at")
        .and_then(Value::as_u64)
        .ok_or_else(|| ApiError::new(StatusCode::BAD_REQUEST, "invalid_auth"))?;
    let challenge_token = body
        .get("challenge_token")
        .and_then(Value::as_str)
        .filter(|value| !value.is_empty() && value.len() <= 256)
        .ok_or_else(|| ApiError::new(StatusCode::BAD_REQUEST, "invalid_auth"))?
        .to_owned();
    let auth = body
        .get("auth")
        .and_then(Value::as_object)
        .filter(|value| only_keys(value, &["scheme", "signature"]))
        .ok_or_else(|| ApiError::new(StatusCode::BAD_REQUEST, "invalid_auth"))?;
    let scheme = auth
        .get("scheme")
        .and_then(Value::as_str)
        .filter(|value| *value == signed_auth::SIGNATURE_SCHEME)
        .ok_or_else(|| ApiError::new(StatusCode::BAD_REQUEST, "unsupported_signature_scheme"))?
        .to_owned();
    let signature = auth
        .get("signature")
        .and_then(Value::as_str)
        .filter(|value| !value.is_empty() && value.len() <= 256)
        .ok_or_else(|| ApiError::new(StatusCode::BAD_REQUEST, "invalid_auth"))?
        .to_owned();

    if !web_auth::verify_browser_challenge_token(
        &participant_id,
        &challenge,
        expires_at,
        &challenge_token,
    ) {
        return Err(ApiError::unauthorized());
    }

    let lookup = participant_id.clone();
    let verified = with_db(&state, move |conn| {
        let Some(record) = identity::get_web_participant_verification(conn, &lookup)? else {
            return Ok(None);
        };
        if record.signature_scheme != scheme
            || !web_auth::verify_browser_challenge_signature(
                &record.public_key,
                &signature,
                &lookup,
                &challenge,
                expires_at,
            )
        {
            return Ok(None);
        }
        Ok(Some(record.identity))
    })
    .await?
    .ok_or_else(ApiError::unauthorized)?;

    Ok(json_response(
        StatusCode::OK,
        json!({
            "source": verified.source,
            "instance": verified.instance,
            "label": verified.label,
        }),
    ))
}

