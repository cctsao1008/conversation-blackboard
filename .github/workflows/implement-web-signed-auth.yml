name: implement-web-signed-auth

on:
  push:
    branches:
      - auth-ed25519-v2

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply browser signed-auth phase
        run: python3 .github/scripts/implement_web_signed_auth.py
      - name: Finalize signed browser auth dispatch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          web_auth = Path('src/web_auth.rs')
          text = web_auth.read_text()
          text = text.replace(
              'pub const CREDENTIAL_BUNDLE_PREFIX: &str = "bbcred-v1:";',
              '#[cfg(test)]\npub const CREDENTIAL_BUNDLE_PREFIX: &str = "bbcred-v1:";',
              1,
          )
          text = text.replace(
              'pub fn credential_bundle(participant_id: &str, private_key: &str) -> String {',
              '#[cfg(test)]\npub fn credential_bundle(participant_id: &str, private_key: &str) -> String {',
              1,
          )
          web_auth.write_text(text)

          http = Path('src/http.rs')
          text = http.read_text()
          old = '''async fn post_message(
              State(state): State<AppState>,
              headers: HeaderMap,
              request: Request<Body>,
          ) -> Result<Response, ApiError> {
              let identity = require_identity(&state, &headers).await?;
              let body = read_json_object(request).await?;

              if body.contains_key("source") || body.contains_key("instance") {
                  return Err(ApiError::new(
                      StatusCode::BAD_REQUEST,
                      "identity_is_server_resolved",
                  ));
              }

              if body.contains_key("auth") || body.contains_key("participant_id") || body.contains_key("nonce") {
                  return post_signed_message(&state, body).await;
              }

              let channel = body
          '''
          new = '''async fn post_message(
              State(state): State<AppState>,
              headers: HeaderMap,
              request: Request<Body>,
          ) -> Result<Response, ApiError> {
              let body = read_json_object(request).await?;

              if body.contains_key("source") || body.contains_key("instance") {
                  return Err(ApiError::new(
                      StatusCode::BAD_REQUEST,
                      "identity_is_server_resolved",
                  ));
              }

              if body.contains_key("auth") || body.contains_key("participant_id") || body.contains_key("nonce") {
                  return post_signed_message(&state, body).await;
              }

              let identity = require_identity(&state, &headers).await?;
              let channel = body
          '''
          if old not in text:
              raise SystemExit('generated post_message dispatch marker not found')
          http.write_text(text.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No implementation changes found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs src/signed_auth.rs src/web_auth.rs src/web_auth_contract_tests.rs src/request_auth.rs src/http.rs src/history.rs web/index.html web/app.js
          git commit -m "auth: migrate browser to local Ed25519 signing"
          git push origin HEAD:auth-ed25519-v2
