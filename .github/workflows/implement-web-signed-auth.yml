name: implement-web-signed-auth

on:
  push:
    branches:
      - auth-ed25519-v2

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply browser signed-auth phase
        run: python3 .github/scripts/implement_web_signed_auth.py
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No implementation changes found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs src/signed_auth.rs src/web_auth.rs src/web_auth_contract_tests.rs src/request_auth.rs src/http.rs src/history.rs web/index.html web/app.js
          git commit -m "auth: migrate browser to local Ed25519 signing"
          git push origin HEAD:auth-ed25519-v2
