name: issue99-wire-compat

on:
  push:
    paths:
      - '.github/scripts/issue99_wire_compat_fix.py'
      - '.github/workflows/issue99-wire-compat.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply MCP modern/legacy wire compatibility repair
        run: python .github/scripts/issue99_wire_compat_fix.py
      - name: Format and verify
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets
      - name: Commit repair and remove temporary helpers
        run: |
          rm .github/scripts/issue99_wire_compat_fix.py
          rm .github/workflows/issue99-wire-compat.yml
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add -A
          git commit -m "#99 Preserve dual-era MCP wire compatibility"
          git push origin HEAD:main
