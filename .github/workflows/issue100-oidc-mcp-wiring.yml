name: issue100-oidc-mcp-wiring

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/issue100_oidc_mcp_wiring.py'
      - '.github/workflows/issue100-oidc-mcp-wiring.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply OIDC MCP wiring
        run: python .github/scripts/issue100_oidc_mcp_wiring.py
      - name: Format and verify
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
      - name: Commit durable wiring
        run: |
          git config user.name "Cheng"
          git config user.email "chiacheng.tsao@gmail.com"
          git add src/oidc.rs src/mcp.rs src/runtime.rs
          git commit -m "#100 Share OIDC verifier with remote MCP"
      - name: Remove temporary migration helpers
        run: |
          git rm .github/scripts/issue100_oidc_mcp_wiring.py .github/workflows/issue100-oidc-mcp-wiring.yml
          git commit -m "#100 Remove OIDC MCP wiring migration helpers"
      - name: Push
        run: git push origin HEAD:main
