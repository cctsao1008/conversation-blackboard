name: issue100-mcp-bearer-principal

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/issue100_mcp_bearer_principal.py'
      - '.github/workflows/issue100-mcp-bearer-principal.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply bearer principal integration
        run: python .github/scripts/issue100_mcp_bearer_principal.py
      - name: Format and verify
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
      - name: Commit bearer principal integration
        run: |
          git config user.name "Cheng"
          git config user.email "chiacheng.tsao@gmail.com"
          git add src/oidc.rs src/mcp.rs
          git commit -m "#100 Route MCP bearer callers through Blackboard authority"
      - name: Remove temporary migration helpers
        run: |
          git rm .github/scripts/issue100_mcp_bearer_principal.py .github/workflows/issue100-mcp-bearer-principal.yml
          git commit -m "#100 Remove MCP bearer principal migration helpers"
      - name: Push
        run: git push origin HEAD:main
