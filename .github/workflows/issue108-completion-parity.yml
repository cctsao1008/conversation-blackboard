name: issue108-completion-parity

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/issue108_completion_parity_patch.py'
      - '.github/workflows/issue108-completion-parity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply completion parity patch
        run: python .github/scripts/issue108_completion_parity_patch.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Verify Rust formatting
        run: cargo fmt --all -- --check
      - name: Validate OpenAPI YAML
        run: |
          python - <<'PY'
          import yaml
          with open('integrations/openapi.yaml', encoding='utf-8') as f:
              doc = yaml.safe_load(f)
          assert doc['openapi'] == '3.1.0'
          for path in [
              '/api/authorization-grants/durable',
              '/api/authorization-grants/durable/{grant_id}',
              '/api/authorization-grants/delegated',
              '/api/authorization-grants/delegated/{grant_id}',
          ]:
              assert path in doc['paths'], path
          PY
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full Rust tests
        run: cargo test --all-targets --all-features
      - name: Commit durable completion parity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrations/openapi.yaml src/http_contract_tests.rs src/contract_parity_tests.rs src/authorization_admin.rs README.md docs/authorization-policy.md docs/contract-projections.md
          git commit -m '#108 Complete REST authorization administration parity'
      - name: Remove temporary helpers
        run: |
          git rm .github/scripts/issue108_completion_parity_patch.py
          git rm .github/workflows/issue108-completion-parity.yml
          git commit -m '#108 Remove completion parity migration helpers'
      - name: Push main
        run: git push origin HEAD:main
