name: implement-signed-navigation

on:
  push:
    branches:
      - auth-ed25519-v2

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply signed navigation phase
        run: python3 .github/scripts/implement_signed_navigation.py
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No implementation changes found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/http.rs src/http_contract_tests.rs
          git commit -m "auth: add signed navigation writes"
          git push origin HEAD:auth-ed25519-v2
