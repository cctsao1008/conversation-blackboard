name: issue96-integrity

on:
  push:
    paths:
      - '.github/scripts/issue96_integrity_patch.py'
      - '.github/workflows/issue96-integrity.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply atomic integrity patch
        run: |
          python .github/scripts/issue96_integrity_patch.py
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/execution.rs')
          s = p.read_text(encoding='utf-8')
          pattern = r"let grant: Option<\(\s*String,\s*String,\s*i64,\s*Option<i64>,\s*Option<String>,\s*\)> = conn"
          s, count = re.subn(pattern, "let grant = conn", s, count=1)
          if count != 1:
              raise SystemExit(f'expected one delegated grant type annotation, found {count}')
          old = '''                                |row| {
                                    Ok((
                                        row.get(0)?,
                                        row.get(1)?,
                                        row.get(2)?,
                                        row.get(3)?,
                                        row.get(4)?,
                                    ))
                                },
'''
          new = '''                                |row| {
                                    Ok((
                                        row.get::<_, String>(0)?,
                                        row.get::<_, String>(1)?,
                                        row.get::<_, i64>(2)?,
                                        row.get::<_, Option<i64>>(3)?,
                                        row.get::<_, Option<String>>(4)?,
                                    ))
                                },
'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one delegated grant row mapper, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Format and verify
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets
      - name: Commit implementation and remove temporary helpers
        run: |
          rm .github/scripts/issue96_integrity_patch.py
          rm .github/workflows/issue96-integrity.yml
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add -A
          git commit -m "#96 Verify atomic execution replay and one-shot state"
          git push origin HEAD:main
