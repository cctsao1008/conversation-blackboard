name: issue96-integrity

on:
  push:
    paths:
      - '.github/scripts/issue96_integrity_patch.py'
      - '.github/workflows/issue96-integrity.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply atomic integrity patch
        run: python .github/scripts/issue96_integrity_patch.py
      - name: Format and verify
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets
      - name: Commit implementation and remove temporary helpers
        run: |
          rm .github/scripts/issue96_integrity_patch.py
          rm .github/workflows/issue96-integrity.yml
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add -A
          git commit -m "#96 Verify atomic execution replay and one-shot state"
          git push origin HEAD:main
