name: issue113-http-window

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/issue113_http_window_patch.py'
      - '.github/scripts/issue113_retire_legacy_channel_readers.py'
      - '.github/workflows/issue113-http-window.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply bounded channel HTTP projection
        run: python .github/scripts/issue113_http_window_patch.py
      - name: Retire legacy unbounded channel readers
        run: python .github/scripts/issue113_retire_legacy_channel_readers.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full Rust tests
        run: cargo test --all-targets --all-features
      - name: Validate OpenAPI YAML
        run: python - <<'PY'
          import yaml
          yaml.safe_load(open('integrations/openapi.yaml'))
          PY
      - name: Commit bounded channel HTTP projection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/db.rs src/http.rs src/http_contract_tests.rs integrations/openapi.yaml
          git commit -m '#113 Project bounded channel directory over HTTP'
      - name: Remove temporary helpers
        run: |
          git rm .github/scripts/issue113_http_window_patch.py
          git rm .github/scripts/issue113_retire_legacy_channel_readers.py
          git rm .github/workflows/issue113-http-window.yml
          git commit -m '#113 Remove channel HTTP migration helpers'
      - name: Push main
        run: git push origin HEAD:main
