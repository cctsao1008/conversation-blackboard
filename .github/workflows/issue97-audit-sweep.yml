name: issue97-audit-sweep

on:
  push:
    paths:
      - '.github/scripts/issue97_sweep_patch.py'
      - '.github/workflows/issue97-audit-sweep.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply execution audit sweep patch
        run: |
          python .github/scripts/issue97_sweep_patch.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/execution.rs')
          s = p.read_text(encoding='utf-8')
          old = '''        stmt.query_map([], |row| {
              Ok((row.get::<_, String>(0)?, row.get::<_, String>(1)?))
          })?
          .collect::<rusqlite::Result<Vec<_>>>()?
      };'''
          new = '''        let rows = stmt
              .query_map([], |row| {
                  Ok((row.get::<_, String>(0)?, row.get::<_, String>(1)?))
              })?
              .collect::<rusqlite::Result<Vec<_>>>()?;
          rows
      };'''
          if old not in s:
              raise SystemExit('missing identities query marker')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Format and verify
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets
      - name: Commit implementation and remove temporary helpers
        run: |
          rm .github/scripts/issue97_sweep_patch.py
          rm .github/workflows/issue97-audit-sweep.yml
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add -A
          git commit -m "#97 Add database-wide execution audit sweep"
          git push origin HEAD:main
