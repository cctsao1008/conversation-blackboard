name: issue106-decision-hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue106-decision-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply authorization decision hardening
        run: |
          python .github/scripts/issue106_decision_hardening.py
          cargo fmt --all
      - name: Verify decision authority and adapter boundaries
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
      - name: Commit authorization decision hardening
        run: |
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add src/authorization.rs src/contract_parity_tests.rs docs/authorization-policy.md docs/contract-projections.md
          git commit -m '#106 Harden authorization decision boundaries'
      - name: Remove temporary migration helpers
        run: |
          git rm .github/scripts/issue106_decision_hardening.py .github/workflows/issue106-decision-hardening.yml
          git commit -m '#106 Remove decision hardening helpers'
      - name: Push
        run: git push origin HEAD:main
