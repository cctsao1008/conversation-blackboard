name: issue111-history-window

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/issue111_history_window_patch.py'
      - '.github/workflows/issue111-history-window.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply bounded history patch
        run: python .github/scripts/issue111_history_window_patch.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full Rust tests
        run: cargo test --all-targets --all-features
      - name: Commit canonical bounded history tranche
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/authorization_admin.rs src/grant_admin.rs
          git commit -m '#111 Add canonical bounded administration history window'
      - name: Remove temporary helpers
        run: |
          git rm .github/scripts/issue111_history_window_patch.py
          git rm .github/workflows/issue111-history-window.yml
          git commit -m '#111 Remove bounded history migration helpers'
      - name: Push main
        run: git push origin HEAD:main
