name: issue90-semantic-effect-integrity

on:
  push:
    paths:
      - '.github/scripts/issue90_patch.py'
      - '.github/workflows/issue90-semantic-effect-integrity.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply semantic effect integrity migration
        run: python .github/scripts/issue90_patch.py
      - name: Format and verify
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
      - name: Commit implementation and remove temporary helpers
        run: |
          rm .github/scripts/issue90_patch.py
          rm .github/workflows/issue90-semantic-effect-integrity.yml
          git config user.name Cheng
          git config user.email chiacheng.tsao@gmail.com
          git add -A
          git commit -m '#90 Verify receipt hash against persisted semantic effect'
          git push origin HEAD:main
