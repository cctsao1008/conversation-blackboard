name: issue100-unauthenticated-401

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/issue100_unauthenticated_401.py'
      - '.github/workflows/issue100-unauthenticated-401.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply protected MCP 401 migration
        run: python .github/scripts/issue100_unauthenticated_401.py
      - name: Format and verify
        run: |
          cargo fmt
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
      - name: Commit protected MCP 401 boundary
        run: |
          git config user.name "Cheng"
          git config user.email "chiacheng.tsao@gmail.com"
          git add src/mcp.rs src/mcp_contract_tests.rs
          git commit -m "#100 Challenge unauthenticated protected MCP calls"
      - name: Remove temporary migration helpers
        run: |
          git rm .github/scripts/issue100_unauthenticated_401.py .github/workflows/issue100-unauthenticated-401.yml
          git commit -m "#100 Remove protected MCP 401 helpers"
      - name: Push
        run: git push origin HEAD:main
