name: issue114-access-context-readonly

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/issue114_access_context_readonly.py'
      - '.github/scripts/issue114_fix_source_guard.py'
      - '.github/workflows/issue114-access-context-readonly.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply access-context read-only hardening
        run: python .github/scripts/issue114_access_context_readonly.py
      - name: Fix source guard slicing
        run: python .github/scripts/issue114_fix_source_guard.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full Rust tests
        run: cargo test --all-targets --all-features
      - name: Commit access-context read-only hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/authorization.rs src/access_api.rs src/mcp.rs src/http_contract_tests.rs src/mcp_contract_tests.rs tests/access_context_readonly_contract.rs
          git commit -m '#114 Make access-context reads schema-pure'
      - name: Remove temporary helpers
        run: |
          git rm .github/scripts/issue114_access_context_readonly.py
          git rm .github/scripts/issue114_fix_source_guard.py
          git rm .github/workflows/issue114-access-context-readonly.yml
          git commit -m '#114 Remove access-context migration helpers'
      - name: Push main
        run: git push origin HEAD:main
