name: issue109-history-rest

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/issue109_history_rest_patch.py'
      - '.github/workflows/issue109-history-rest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply history REST patch
        run: python .github/scripts/issue109_history_rest_patch.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full Rust tests
        run: cargo test --all-targets --all-features
      - name: Commit durable history REST projection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/authorization.rs src/authorization_admin.rs src/access_api.rs src/http_contract_tests.rs
          git commit -m '#109 Add authorization administration history REST projection'
      - name: Remove temporary helpers
        run: |
          git rm .github/scripts/issue109_history_rest_patch.py
          git rm .github/workflows/issue109-history-rest.yml
          git commit -m '#109 Remove history REST migration helpers'
      - name: Push main
        run: git push origin HEAD:main
