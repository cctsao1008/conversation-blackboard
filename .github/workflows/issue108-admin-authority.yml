name: issue108-admin-authority

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/issue108_admin_authority_patch.py'
      - '.github/workflows/issue108-admin-authority.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply administration authority boundary
        run: python .github/scripts/issue108_admin_authority_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full Rust tests
        run: cargo test --all-targets --all-features
      - name: Commit durable implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/authorization.rs src/authorization_admin.rs
          git commit -m '#108 Establish atomic remote administration authority boundary'
      - name: Remove migration helpers
        run: |
          git rm .github/scripts/issue108_admin_authority_patch.py
          git rm .github/workflows/issue108-admin-authority.yml
          git commit -m '#108 Remove administration authority migration helpers'
      - name: Push main
        run: git push origin HEAD:main
