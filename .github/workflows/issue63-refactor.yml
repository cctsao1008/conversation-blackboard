name: issue63-refactor

on:
  push:
    branches: [main]
    paths:
      - scripts/issue63-refactor.py

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply Issue 63 refactor
        run: python scripts/issue63-refactor.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit generated refactor
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "#63 Apply HMAC-only auth refactor"
          git push
