name: issue109-history-mcp-retry

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/issue109_history_mcp_count_fix.py'
      - '.github/workflows/issue109-history-mcp-retry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply history MCP patch
        run: python .github/scripts/issue109_history_mcp_patch.py
      - name: Repair exact modern tool inventory
        run: python .github/scripts/issue109_history_mcp_count_fix.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full Rust tests
        run: cargo test --all-targets --all-features
      - name: Commit durable history MCP projection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/contract_schema.rs src/mcp.rs src/mcp_contract_tests.rs tests/mcp_stdio_server.rs
          git commit -m '#109 Add authorization administration history MCP projection'
      - name: Remove temporary helpers
        run: |
          git rm .github/scripts/issue109_history_mcp_patch.py
          git rm .github/scripts/issue109_history_mcp_count_fix.py
          git rm .github/workflows/issue109-history-mcp.yml
          git rm .github/workflows/issue109-history-mcp-retry.yml
          git commit -m '#109 Remove history MCP migration helpers'
      - name: Push main
        run: git push origin HEAD:main
