name: issue113-channel-window

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/issue113_channel_window_patch.py'
      - '.github/scripts/issue113_channel_window_use.py'
      - '.github/workflows/issue113-channel-window.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply canonical channel window patch
        run: python .github/scripts/issue113_channel_window_patch.py
      - name: Route legacy readers through bounded primitive
        run: python .github/scripts/issue113_channel_window_use.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full Rust tests
        run: cargo test --all-targets --all-features
      - name: Commit canonical channel directory window
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/db.rs
          git commit -m '#113 Add canonical bounded channel directory window'
      - name: Remove temporary helpers
        run: |
          git rm .github/scripts/issue113_channel_window_patch.py
          git rm .github/scripts/issue113_channel_window_use.py
          git rm .github/workflows/issue113-channel-window.yml
          git commit -m '#113 Remove channel window migration helpers'
      - name: Push main
        run: git push origin HEAD:main
